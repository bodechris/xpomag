services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xpomag
      POSTGRES_PASSWORD: xpomag
      POSTGRES_DB: xpomag
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - xpomag_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpomag -d xpomag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - xpomag_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xpomag_postgres:
  xpomag_redis:
